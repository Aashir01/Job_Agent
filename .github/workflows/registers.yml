# §6: the sponsorship registers the Gatekeeper cross-references are refreshed
# weekly. A stale register still kills correctly; an empty one passes
# everything, so a failed refresh keeps the previous rows and never fails the run.
name: refresh-sponsor-registers

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays, 05:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The keys live in an Environment ("env"), and environment secrets are only
    # readable by a job that claims that environment — without this line every
    # `secrets.*` silently resolves to an empty string. Override the name with
    # the repository variable SECRETS_ENVIRONMENT if you rename it; referencing
    # an environment that does not exist creates an unprotected one, so the
    # fallback is safe.
    environment: ${{ vars.SECRETS_ENVIRONMENT || 'env' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Override when the Home Office rotates the published filename.
      REGISTER_URL_UK: ${{ vars.REGISTER_URL_UK }}
      REGISTER_URL_NL: ${{ vars.REGISTER_URL_NL }}
      REGISTER_URL_CA: ${{ vars.REGISTER_URL_CA }}
    steps:
      - uses: actions/checkout@v5

      - name: Preflight — can this job see the secrets?
        id: preflight
        uses: ./.github/actions/preflight
        with:
          secrets-json: ${{ toJSON(secrets) }}
          require-llm: "false"

      - name: Stop if the configuration is missing
        if: steps.preflight.outputs.ready != 'true'
        run: |
          echo "::error::Missing: ${{ steps.preflight.outputs.missing }} — see the job summary."
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m app.cli registers
