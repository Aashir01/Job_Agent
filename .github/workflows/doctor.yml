# "Why isn't it working?" — run this from the Actions tab any time.
#
# It never changes anything and never applies for a job. It reports which
# secrets this repository's workflows can actually see, whether Supabase
# answers, how much seed data is loaded, and optionally sends a test digest.
name: doctor

on:
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Also send a test digest to every configured channel"
        type: boolean
        default: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v5

      # The action only reports, so the run continues to the database and
      # seed-data checks even when secrets are missing — the point is to see
      # the whole picture, not to stop at the first problem. The job still
      # ends red (last step), because a diagnostic that found a fatal problem
      # should not show a green check.
      - name: Which secrets can this job see?
        id: preflight
        uses: ./.github/actions/preflight
        with:
          secrets-json: ${{ toJSON(secrets) }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - run: pip install -r requirements.txt

      - name: Check settings, database and seed data
        if: steps.preflight.outputs.ready == 'true'
        run: python -m app.cli doctor

      - name: Send a test digest
        if: steps.preflight.outputs.ready == 'true' && inputs.send_test_notification
        run: python -m app.cli notify-test

      - name: Say what to do next
        if: steps.preflight.outputs.ready != 'true'
        run: |
          {
            echo "### Next step"
            echo
            echo "Add the missing secrets above, then run **doctor** again."
            echo "Once it is green, run **batch**."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Missing: ${{ steps.preflight.outputs.missing }}"
          exit 1
