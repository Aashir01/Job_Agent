# §4 batch cadence.
#
#   02:00 UTC (07:00 PKT) — overnight US postings, plus anything EU posted late.
#   14:00 UTC (19:00 PKT) — EU/UK roles posted that same business morning, so
#                           they reach the queue inside the 72-hour window where
#                           response rates are highest. This is the important one.
#
# §8 budget: 2000 GH Actions minutes a month, spent as 2 runs × ~8 min.
name: batch

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "Batch kind"
        type: choice
        options: [manual, backfill]
        default: manual
      skip_scout:
        description: "Skip discovery and only process jobs already stored"
        type: boolean
        default: false

concurrency:
  group: job-agent-batch
  cancel-in-progress: false

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger the batch
        id: trigger
        env:
          API_URL: ${{ secrets.API_URL }}
          AGENT_KEY: ${{ secrets.AGENT_KEY }}
          KIND: ${{ inputs.kind || 'scheduled' }}
          SKIP_SCOUT: ${{ inputs.skip_scout || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ] || [ -z "${AGENT_KEY:-}" ]; then
            echo "::error::API_URL and AGENT_KEY repository secrets must be set"
            exit 1
          fi

          # wait=true runs the pipeline inline so this job's exit code reflects
          # the batch, not just the HTTP handshake. Fly cold-starts the machine.
          response=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 --retry-connrefused \
            --max-time 900 \
            -X POST "${API_URL%/}/batch/run?kind=${KIND}&skip_scout=${SKIP_SCOUT}&wait=true" \
            -H "X-Agent-Key: ${AGENT_KEY}")

          echo "$response" > batch.json
          python3 - <<'PY'
          import json, os
          data = json.load(open("batch.json"))
          stats = data.get("stats", {})
          lines = [
              "## Batch result",
              "",
              f"- batch id: `{data.get('batch_id', 'n/a')}`",
              f"- packages built: **{stats.get('packages_built', 0)}**",
              f"- killed by the Gatekeeper: {stats.get('killed_by_gatekeeper', 0)}",
              f"- killed on score: {stats.get('killed_by_score', 0)}",
              f"- LLM calls: {stats.get('llm_calls', 0)} (${stats.get('llm_cost_usd', 0)})",
              f"- tiers: `{stats.get('tiers', {})}`",
              f"- scout: `{stats.get('scout', {})}`",
          ]
          if stats.get("quota_exhausted"):
              lines.append("- :warning: **LLM budget exhausted** — remaining jobs roll to the next batch")
          for err in stats.get("errors", [])[:5]:
              lines.append(f"- :x: {err}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Fail if the batch reported failure
        run: |
          set -euo pipefail
          status=$(python3 -c "import json;print(json.load(open('batch.json')).get('stats',{}).get('errors',[]) and 'errors' or 'clean')")
          if [ "$status" = "errors" ]; then
            echo "::warning::the batch completed with errors; see the job summary"
          fi
