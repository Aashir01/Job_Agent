# §4 batch — manual runs only, by design.
#
# There is no cron. A batch starts only when you ask for one:
#   - from the dashboard: "Save and run" → POST /batch/run on the deployed API
#     (this is the normal path), or
#   - from the Actions tab: "Run workflow" below.
# Nothing hunts while you are not looking, and no minutes are spent on a schedule
# you did not ask for.
#
# The batch runs here, in the runner, against Supabase directly. It used to POST
# to a deployed API, which meant the run could not work until something was
# hosted — every run failed in six seconds on a missing API_URL. The runner
# already has the compute, so nothing needs deploying for the run to work.
name: batch

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Batch kind"
        type: choice
        options: [manual, backfill]
        default: manual
      skip_scout:
        description: "Skip discovery and only process jobs already stored"
        type: boolean
        default: false

concurrency:
  group: job-agent-batch
  cancel-in-progress: false

jobs:
  run-batch:
    runs-on: ubuntu-latest
    # The keys live in an Environment ("env"), and environment secrets are only
    # readable by a job that claims that environment — without this line every
    # `secrets.*` silently resolves to an empty string. Override the name with
    # the repository variable SECRETS_ENVIRONMENT if you rename it; referencing
    # an environment that does not exist creates an unprotected one, so the
    # fallback is safe.
    environment: ${{ vars.SECRETS_ENVIRONMENT || 'env' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    env:
      # Required. Without these the run stops immediately and says so.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # At least one LLM provider.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Optional: where the digest goes, and what it links to.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      # Optional extras.
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      LLM_CALLS_PER_BATCH: ${{ vars.LLM_CALLS_PER_BATCH || '300' }}
    steps:
      - uses: actions/checkout@v5

      - name: Preflight — can this job see the secrets?
        id: preflight
        uses: ./.github/actions/preflight
        with:
          secrets-json: ${{ toJSON(secrets) }}

      - name: Stop if the configuration is missing
        if: steps.preflight.outputs.ready != 'true'
        run: |
          echo "::error::Missing: ${{ steps.preflight.outputs.missing }} — see the job summary."
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - run: pip install -r requirements.txt

      - name: Check configuration
        run: python -m app.cli doctor

      - name: Run the batch
        env:
          KIND: ${{ inputs.kind || 'scheduled' }}
          SKIP_SCOUT: ${{ inputs.skip_scout || 'false' }}
        run: |
          set -euo pipefail
          args=(batch --kind "$KIND")
          # An explicit if, not `[ … ] && args+=(…)`: under `set -e` that line
          # fails the whole step the moment anything is appended after it.
          if [ "$SKIP_SCOUT" = "true" ]; then
            args+=(--skip-scout)
          fi
          python -m app.cli "${args[@]}"
