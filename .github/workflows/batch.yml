# §4 batch cadence.
#
#   02:00 UTC (07:00 PKT) — overnight US postings, plus anything EU posted late.
#   14:00 UTC (19:00 PKT) — EU/UK roles posted that same business morning, so
#                           they reach the queue inside the 72-hour window where
#                           response rates are highest. This is the important one.
#
# The batch runs here, in the runner, against Supabase directly. It used to POST
# to a deployed API, which meant the schedule could not work until something was
# hosted — every scheduled run failed in six seconds on a missing API_URL. The
# runner already has the compute, so nothing needs deploying for the cron to work.
#
# §8 budget: 2000 GH Actions minutes a month, spent as 2 runs of a few minutes.
name: batch

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "Batch kind"
        type: choice
        options: [manual, backfill]
        default: manual
      skip_scout:
        description: "Skip discovery and only process jobs already stored"
        type: boolean
        default: false

concurrency:
  group: job-agent-batch
  cancel-in-progress: false

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    env:
      # Required. Without these the run stops immediately and says so.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # At least one LLM provider.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Optional: where the digest goes, and what it links to.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      # Optional extras.
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      LLM_CALLS_PER_BATCH: ${{ vars.LLM_CALLS_PER_BATCH || '300' }}
    steps:
      - uses: actions/checkout@v5

      - name: Preflight — can this job see the secrets?
        uses: ./.github/actions/preflight
        with:
          secrets-json: ${{ toJSON(secrets) }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - run: pip install -r requirements.txt

      - name: Check configuration
        run: python -m app.cli doctor

      - name: Run the batch
        env:
          KIND: ${{ inputs.kind || 'scheduled' }}
          SKIP_SCOUT: ${{ inputs.skip_scout || 'false' }}
        run: |
          set -euo pipefail
          args=(batch --kind "$KIND")
          # An explicit if, not `[ … ] && args+=(…)`: under `set -e` that line
          # fails the whole step the moment anything is appended after it.
          if [ "$SKIP_SCOUT" = "true" ]; then
            args+=(--skip-scout)
          fi
          python -m app.cli "${args[@]}"
