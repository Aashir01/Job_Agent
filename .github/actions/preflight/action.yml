name: Preflight configuration check
description: >
  Report which secrets a job can actually see, and say which required ones are
  missing. Reports only — the caller decides whether that is fatal.

# NOTE: the `secrets` context does not exist inside a composite action, not even
# inside a string. An expression mentioning it anywhere in this file makes the
# whole manifest fail to load with "Unrecognized named-value: 'secrets'", and
# the check silently never runs. The caller passes the context in as an input;
# that expression is evaluated in the workflow, where `secrets` does exist.

inputs:
  secrets-json:
    description: "The secrets context, serialised by the caller. Values are masked by Actions; only names are read."
    required: true
  require-llm:
    description: "Whether this job needs an LLM provider key."
    required: false
    default: "true"

outputs:
  ready:
    description: "true when every required secret is visible to the job."
    value: ${{ steps.check.outputs.ready }}
  missing:
    description: "Space-separated names of what is missing."
    value: ${{ steps.check.outputs.missing }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        SECRETS_JSON: ${{ inputs.secrets-json }}
        REQUIRE_LLM: ${{ inputs.require-llm }}
      run: |
        set -euo pipefail

        # The context lists every secret the job can see. Actions masks the
        # values in logs and we never echo the JSON anyway — only key names.
        # This is the check that separates "I set it" from "this job can see
        # it": a secret added under Environments, Dependabot or Codespaces is
        # invisible here and resolves to an empty string with no warning.
        umask 077
        vault="$RUNNER_TEMP/preflight-secrets.json"
        printf '%s' "$SECRETS_JSON" > "$vault"
        if ! jq -e 'type == "object"' "$vault" >/dev/null 2>&1; then
          # Never print the file: if the input really is a single secret value,
          # echoing it would write a credential into a public repository's log.
          rm -f "$vault"
          echo "::error::The secrets context did not arrive as a JSON object."
          echo "The caller must pass the whole context, serialised with toJSON."
          exit 1
        fi
        visible=$(jq -r 'keys[]' "$vault" | grep -vx 'github_token' || true)
        rm -f "$vault"

        has() { printf '%s\n' "$visible" | grep -qx "$1"; }

        missing=()
        has SUPABASE_URL          || missing+=("SUPABASE_URL")
        has SUPABASE_SERVICE_KEY  || missing+=("SUPABASE_SERVICE_KEY")
        if [ "$REQUIRE_LLM" = "true" ]; then
          if ! has OPENROUTER_API_KEY && ! has GEMINI_API_KEY && ! has GROQ_API_KEY; then
            missing+=("OPENROUTER_API_KEY|GEMINI_API_KEY|GROQ_API_KEY")
          fi
        fi

        count=$(printf '%s\n' "$visible" | grep -c . || true)
        {
          echo "### Configuration"
          echo
          echo "Repository secrets, plus those of the environment this job claims."
          if [ "$count" -eq 0 ]; then
            echo "This job can see **no repository secrets at all**."
          else
            echo "Secrets visible to this job (${count}):"
            echo
            printf '%s\n' "$visible" | sed 's/^/- `/; s/$/`/'
          fi
          echo
        } >> "$GITHUB_STEP_SUMMARY"

        printf 'Secrets visible to this job:\n%s\n' "${visible:-  (none)}"

        if [ ${#missing[@]} -eq 0 ]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "missing=" >> "$GITHUB_OUTPUT"
          echo "All required configuration is present." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        echo "ready=false" >> "$GITHUB_OUTPUT"
        echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
        {
          echo "**Missing:**"
          echo
          for name in "${missing[@]}"; do echo "- \`$name\`"; done
          echo
          echo "Add them at **Settings → Secrets and variables → Actions**, on the"
          echo "**Repository secrets** tab, then re-run."
          echo
          echo "> Every name on that tab appears in the list above. If a secret you"
          echo "> added is *not* listed, it went somewhere this job cannot read:"
          echo ">"
          echo "> | Where you may have put it | Why it is invisible here |"
          echo "> |---|---|"
          echo "> | The **Variables** tab (same page) | Variables are a different store from secrets. |"
          echo "> | An **Environment** other than the one this job claims | These jobs claim the environment named by the repository variable SECRETS_ENVIRONMENT, defaulting to \`env\`. Secrets in a different environment are invisible. |"
          echo "> | **Dependabot** tab | A separate store; Actions never sees it. |"
          echo "> | **Codespaces** tab | Also separate. |"
          echo "> | Your **user/org** account | Needs this repository granted access. |"
          echo "> | A **different repository** | Check the URL of the settings page. |"
          echo ">"
          echo "> Names are case-sensitive and must match exactly, with no spaces."
        } >> "$GITHUB_STEP_SUMMARY"

        # Reporting only. The caller decides whether missing config is fatal.
        exit 0
